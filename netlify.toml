# This repo contains the prebuilt site (index.html + assets), not the source,
# so there is no build step: publish the repo root as-is.
[build]
  command = ""
  publish = "."

[[redirects]]
  from = "/build"
  to = "/build.html"
  status = 301

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# The a11y plugin is also enabled in the Netlify UI; with no paths to check it
# skips scanning (scanning the client-rendered page times out and fails deploys).
[[plugins]]
  package = "netlify-plugin-a11y"
  [plugins.inputs]
    checkPaths = []
    resultMode = "warn"
